services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "${RABBITMQ_PORT_UI}:15672"
      - "${RABBITMQ_PORT_AMQP}:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    env_file: .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT}:80"
    env_file: .env
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: .docker/Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - GIN_MODE=release
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/.photos/

  evaluator:
    build:
      context: ./evaluator
      dockerfile: Dockerfile
    container_name: evaluator
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - image_data:/app/.photos/
      - torch_hub:/root/.cache/torch/hub/

volumes:
  rabbitmq_data:
    driver: local
  image_data:
    driver: local
  torch_hub:
    driver: local
